<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>hve-video-director — promo</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
<!-- Three.js bootstrap — a CROSS-FRAME concern, so the root owns it (Phase 4).
     A sub-composition's <script> is cloned out of its <template> and re-executed in
     this document, where module semantics do not survive: a bare `import` throws
     "Cannot use import statement outside a module" and `check` fails on the page
     error. So the module lives HERE, once, and scenes consume it through a
     ready-queue with a classic script. Late subscribers run immediately, so a scene
     can subscribe whether it is cloned before or after this resolves. -->
<script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
  window.THREE = THREE;
  const pending = window.__threeReady || [];
  window.__threeReady = { push: (fn) => fn(THREE) };
  pending.forEach((fn) => fn(THREE));
</script>
<style>
  html, body { margin: 0; background: #1c1e54; }
  /* Opaque stage ground — required (SEAM_RENDER_MECHANICS): a summed-opacity gap
     during a dissolve would otherwise flash the page through. */
  #root { background: #1c1e54; position: relative; width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="60">

  <audio data-hf-id="hf-tz0o" id="audio-main" data-start="0" data-duration="60" data-track-index="0" src="voiceover-with-music.mp3"></audio>

  <!-- opens the film -->
  <div data-hf-id="hf-mguk" id="el-hook" data-composition-id="scene-00-hook" data-composition-src="scenes/00-hook.html" data-start="0" data-duration="5.7" data-track-index="1" data-width="1920" data-height="1080"></div>
  <!-- dissolve-reached: owns its initial state -->
  <div data-hf-id="hf-s6jz" id="el-pain" data-composition-id="scene-01-pain" data-composition-src="scenes/01-pain.html" data-start="5" data-duration="8.0" data-track-index="2" data-width="1920" data-height="1080"></div>
  <!-- ledgered cut: SEAM_STAMP owns the base state -->
  <div data-hf-id="hf-9wx7" id="el-turn" data-composition-id="scene-02-turn" data-composition-src="scenes/02-turn.html" data-start="13" data-duration="6.7" data-track-index="3" data-width="1920" data-height="1080"></div>
  <!-- dissolve-reached: owns its initial state -->
  <div data-hf-id="hf-vsr1" id="el-reasoning" data-composition-id="scene-03-reasoning" data-composition-src="scenes/03-reasoning.html" data-start="19" data-duration="9.0" data-track-index="4" data-width="1920" data-height="1080"></div>
  <!-- ledgered cut: SEAM_STAMP owns the base state -->
  <div data-hf-id="hf-24vb" id="el-stack" data-composition-id="scene-04-stack" data-composition-src="scenes/04-stack.html" data-start="28" data-duration="8.0" data-track-index="5" data-width="1920" data-height="1080"></div>
  <!-- ledgered cut: SEAM_STAMP owns the base state -->
  <div data-hf-id="hf-zcm4" id="el-hero" data-composition-id="scene-05-hero" data-composition-src="scenes/05-hero.html" data-start="36" data-duration="8.7" data-track-index="6" data-width="1920" data-height="1080"></div>
  <!-- dissolve-reached: owns its initial state -->
  <div data-hf-id="hf-ds20" id="el-capabilities" data-composition-id="scene-06-capabilities" data-composition-src="scenes/06-capabilities.html" data-start="44" data-duration="9.0" data-track-index="7" data-width="1920" data-height="1080"></div>
  <!-- ledgered cut: SEAM_STAMP owns the base state -->
  <div data-hf-id="hf-i87b" id="el-cta" data-composition-id="scene-07-cta" data-composition-src="scenes/07-cta.html" data-start="53" data-duration="7.0" data-track-index="8" data-width="1920" data-height="1080"></div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  // Root hosts the seams only; SEAM_STAMP writes them into this timeline.
  const tl = gsap.timeline({ paused: true });
  tl.to({}, { duration: 60 });
  window.__timelines["main"] = tl;

      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#el-pain", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#el-reasoning","#el-capabilities"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set("#el-turn", { autoAlpha: 0, scale: 0.78, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#el-stack", { autoAlpha: 0, scale: 0.78, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#el-hero", { autoAlpha: 0, scale: 0.78, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      gsap.set("#el-cta", { autoAlpha: 0, scale: 0.78, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      
      // SEAM — pain→turn : zoom-through (cut @13)
      tl.to("#el-pain", { scale: 1.18, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 12.79);
      tl.to("#el-pain", { autoAlpha: 0, duration: 0.21, ease: "none" }, 12.79);
      tl.set("#el-pain", { autoAlpha: 0 }, 13);
      tl.fromTo("#el-turn", { autoAlpha: 0.15, scale: 0.78, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 13);
      
      // SEAM — reasoning→stack : zoom-through (cut @28)
      tl.to("#el-reasoning", { scale: 1.18, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 27.79);
      tl.to("#el-reasoning", { autoAlpha: 0, duration: 0.21, ease: "none" }, 27.79);
      tl.set("#el-reasoning", { autoAlpha: 0 }, 28);
      tl.fromTo("#el-stack", { autoAlpha: 0.15, scale: 0.78, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 28);
      
      // SEAM — stack→hero : zoom-through (cut @36)
      tl.to("#el-stack", { scale: 1.18, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 35.79);
      tl.to("#el-stack", { autoAlpha: 0, duration: 0.21, ease: "none" }, 35.79);
      tl.set("#el-stack", { autoAlpha: 0 }, 36);
      tl.fromTo("#el-hero", { autoAlpha: 0.15, scale: 0.78, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 36);
      
      // SEAM — capabilities→cta : zoom-through (cut @53)
      tl.to("#el-capabilities", { scale: 1.18, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 52.79);
      tl.to("#el-capabilities", { autoAlpha: 0, duration: 0.21, ease: "none" }, 52.79);
      tl.set("#el-capabilities", { autoAlpha: 0 }, 53);
      tl.fromTo("#el-cta", { autoAlpha: 0.15, scale: 0.78, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 53);
      
      // </seams:auto>

      // Dissolve boundaries — no ledger row by definition (a dissolve carries no
      // vector), so SEAM_VERIFIER does not check these and SEAM_STAMP does not
      // write them. Incoming-only fade: the outgoing scene stays at full opacity
      // underneath and is occluded, so the summed opacity never dips below 1 and
      // the stage ground cannot show through (SEAM_RENDER_MECHANICS).
      tl.fromTo("#el-pain",         { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.7, ease: "none", immediateRender: false }, 5);
      tl.fromTo("#el-reasoning",    { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.7, ease: "none", immediateRender: false }, 19);
      tl.fromTo("#el-capabilities", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.7, ease: "none", immediateRender: false }, 44);

</script>
