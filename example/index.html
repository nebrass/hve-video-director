<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>blog.nebrass.fr — promo</title>
  <style>
    /* Body white — a single-frame gap during render shows body color; white = safe
       (every scene also rests on a white/near-white surface). */
    html, body { margin: 0; padding: 0; background: #ffffff; }
  </style>
</head>
<body>
  <!--
    blog.nebrass.fr promo — built by hve-video-director (the reference build / dogfood).
    ~53s, 16:9 1920×1080, Vercel design system (light), product_surface: ui.

    The REAL blog is the spine: scenes 0–3 each composite a live Phase-2 capture in a
    browser frame with a distinct, motivated camera move; scene 4 is the closing text CTA.

    TRANSITION MODEL: each scene's data-duration extends 0.4s past its nominal end; the next
    scene's data-start moves 0.4s earlier, so adjacent scenes overlap during the 0.4s
    crossfade (incoming fades in on top of the still-opaque outgoing scene — no body flash).
    Track indices are unique per scene; DOM order = z-order.
  -->
  <div id="root"
       data-composition-id="main"
       data-width="1920"
       data-height="1080"
       data-start="0"
       data-duration="53">

    <!-- Audio track 0. Placeholder silence until the mixed VO+music lands (README Phase 5). -->
    <audio id="audio-main" data-start="0" data-duration="53" data-track-index="0"
           src="voiceover-with-music.mp3"></audio>

    <!-- Scene 0: Establishing (0 → 8.4) -->
    <div id="load-00-establishing"
         data-composition-id="scene-00-establishing"
         data-composition-src="scenes/00-establishing.html"
         data-start="0" data-duration="8.4" data-track-index="1"></div>

    <!-- Scene 1: Depth (8 → 20.4) -->
    <div id="load-01-depth"
         data-composition-id="scene-01-depth"
         data-composition-src="scenes/01-depth.html"
         data-start="8" data-duration="12.4" data-track-index="2"
         style="opacity:0"></div>

    <!-- Scene 2: Breadth (20 → 30.4) -->
    <div id="load-02-breadth"
         data-composition-id="scene-02-breadth"
         data-composition-src="scenes/02-breadth.html"
         data-start="20" data-duration="10.4" data-track-index="3"
         style="opacity:0"></div>

    <!-- Scene 3: Volume / scroll-within-frame (30 → 42.4) -->
    <div id="load-03-scroll"
         data-composition-id="scene-03-scroll"
         data-composition-src="scenes/03-scroll.html"
         data-start="30" data-duration="12.4" data-track-index="4"
         style="opacity:0"></div>

    <!-- Scene 4: CTA (42 → 53) — closing scene, holds the final frame; no crossfade-out. -->
    <div id="load-04-cta"
         data-composition-id="scene-04-cta"
         data-composition-src="scenes/04-cta.html"
         data-start="42" data-duration="11" data-track-index="5"
         style="opacity:0"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Transitions: only animate the INCOMING scene's opacity 0→1; the outgoing scene stays
    // opaque underneath until its data-duration ends. No body color shows through.
    tl.to('[data-composition-id="scene-01-depth"]',   { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 8);
    tl.to('[data-composition-id="scene-02-breadth"]', { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 20);
    tl.to('[data-composition-id="scene-03-scroll"]',  { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 30);
    tl.to('[data-composition-id="scene-04-cta"]',     { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 42);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
