<!-- Scene 1 — Depth: a real post's syntax-highlighted code + diff, framed, push-in toward the code.
     Real capture (public/screenshots/04-post-code-light.png). From templates/scene-screenshot.html. -->
<template id="scene-01-depth-template">
  <div data-composition-id="scene-01-depth" data-width="1920" data-height="1080">
    <div class="shot-stage">
      <div class="shot-browser">
        <div class="shot-bar">
          <span class="dot dr"></span><span class="dot dy"></span><span class="dot dg"></span>
          <div class="shot-url"><span class="shot-lock"></span><span class="shot-host">blog.nebrass.fr/playing-with-puppeteer…</span></div>
        </div>
        <div class="shot-view">
          <div class="shot-pan">
            <img class="shot-img" src="public/screenshots/04-post-code-light.png" alt="">
          </div>
        </div>
      </div>
      <div class="shot-caption">Every post goes deep — real bugs, real fixes.</div>
    </div>

    <style>
      [data-composition-id="scene-01-depth"]{position:absolute;inset:0;display:flex;
        align-items:center;justify-content:center;
        background:radial-gradient(120% 120% at 50% 0%, #ffffff 0%, #eef1f5 100%);
        font-family:"Geist","Inter",system-ui,sans-serif}
      [data-composition-id="scene-01-depth"] .shot-stage{display:flex;flex-direction:column;
        align-items:center;gap:40px;width:100%}
      [data-composition-id="scene-01-depth"] .shot-browser{width:72%;max-width:1480px;
        border-radius:14px;overflow:hidden;background:#fff;visibility:hidden;opacity:0;
        box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.05),0 40px 90px rgba(0,0,0,.18)}
      [data-composition-id="scene-01-depth"] .shot-bar{display:flex;align-items:center;gap:9px;
        padding:14px 18px;background:#f3f4f6;border-bottom:1px solid rgba(0,0,0,.06)}
      [data-composition-id="scene-01-depth"] .dot{width:13px;height:13px;border-radius:50%}
      [data-composition-id="scene-01-depth"] .dr{background:#ff5f56}
      [data-composition-id="scene-01-depth"] .dy{background:#ffbd2e}
      [data-composition-id="scene-01-depth"] .dg{background:#27c93f}
      [data-composition-id="scene-01-depth"] .shot-url{margin-left:14px;flex:1;max-width:760px;
        display:flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(0,0,0,.07);
        border-radius:8px;padding:7px 14px;color:#6b7280;font-size:18px;
        font-family:"Geist Mono","JetBrains Mono",monospace;white-space:nowrap;overflow:hidden}
      [data-composition-id="scene-01-depth"] .shot-lock{width:11px;height:9px;border:1.5px solid #9aa1ab;
        border-radius:2px;flex:none;position:relative;margin-top:3px}
      [data-composition-id="scene-01-depth"] .shot-lock::before{content:"";position:absolute;left:1.5px;top:-5px;
        width:6px;height:6px;border:1.5px solid #9aa1ab;border-bottom:none;border-radius:3px 3px 0 0}
      [data-composition-id="scene-01-depth"] .shot-view{position:relative;width:100%;
        max-height:72vh;overflow:hidden;background:#fff}
      [data-composition-id="scene-01-depth"] .shot-pan{display:block}
      [data-composition-id="scene-01-depth"] .shot-img{display:block;width:100%;height:auto}
      [data-composition-id="scene-01-depth"] .shot-caption{font-size:30px;color:#4b5563;
        text-align:center;max-width:1100px;letter-spacing:-0.01em;visibility:hidden;opacity:0}
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = '[data-composition-id="scene-01-depth"]';
      tl.fromTo(root + ' .shot-browser', { y: 48, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.7, ease: "expo.out" }, 0.2);
      tl.fromTo(root + ' .shot-caption', { y: 16, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 0.9);
      // Push-in toward the code/diff block (lower-center of the frame); released before crossfade (ends 12.4).
      tl.fromTo(root + ' .shot-browser', { scale: 1.0 },
        { scale: 1.06, transformOrigin: "46% 52%", duration: 7.6, ease: "power1.inOut" }, 1.2);
      window.__timelines["scene-01-depth"] = tl;
    </script>
  </div>
</template>
