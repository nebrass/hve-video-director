name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Every helper in scripts/ is pure standard library, so no pip install and
      # no requirements file. Adding one here would silently permit a dependency
      # the skill's own doctrine forbids.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ffmpeg/ffprobe are what the media tests probe for. They degrade
      # gracefully when absent, so installing them is the difference between
      # running the normalization integration test and skipping it unnoticed.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Report the toolchain the suite will see
        run: |
          python3 --version
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run the suite
        run: bash test/run.sh

      # A bare runner is the only place this is testable. Locally every
      # dependency is already installed, so the unmet-requirement path — the one
      # a new user's first run takes — never executes.
      #
      # Note what is NOT asserted: a zero exit. The checker exits 1 when a
      # required dependency is missing, which is correct here (no
      # chrome-headless-shell, no hyperframes CLI). An earlier version of this
      # step ran it under `bash -e` and failed on that exit code, testing
      # readiness when it meant to test side effects.
      - name: Requirements checker reports cleanly on an unprovisioned machine
        if: always()
        run: |
          set +e
          bash scripts/check_requirements.sh --json > /tmp/report.json; json_rc=$?
          bash scripts/check_requirements.sh --plan > /tmp/plan.txt;    plan_rc=$?
          set -e
          echo "exit codes: --json=$json_rc --plan=$plan_rc"

          # 0 = ready, 1 = something unmet. 2 is a usage/format error: a crash,
          # not a report, and the one outcome that must never happen here.
          test "$json_rc" -ne 2 || { echo "--json exited 2 (malformed/usage)"; cat /tmp/report.json; exit 1; }
          test "$plan_rc" -ne 2 || { echo "--plan exited 2 (malformed/usage)"; cat /tmp/plan.txt; exit 1; }

          # Phase -1 parses this. Invalid JSON on the unmet path would strand a
          # first run at setup with nothing actionable.
          python3 - <<'EOF'
          import json, sys
          report = json.load(open("/tmp/report.json"))
          assert report["schema_version"] == 1, report.get("schema_version")
          checks = report["checks"]
          assert checks, "no checks emitted"
          for c in checks:
              assert {"id","label","tier","state","phases","detail","fixability"} <= set(c), c
              assert c["state"] in {"ready","degraded","blocked"}, c
              assert c["tier"] in {"required","recommended","optional"}, c
          blocked = [c["id"] for c in checks if c["state"] == "blocked"]
          print(f"{len(checks)} checks; blocked on a bare runner: {blocked or 'none'}")
          EOF

          # The actual invariant: a report mode changes nothing on disk.
          git diff --exit-code
          git status --porcelain --untracked-files=all > /tmp/after.txt
          test ! -s /tmp/after.txt || { echo "report mode created files:"; cat /tmp/after.txt; exit 1; }

      # A --fix flag alongside a report mode must be refused, not silently
      # honoured. This is the guard that keeps CI itself from installing things.
      - name: Report modes refuse to be combined with --fix
        if: always()
        run: |
          set +e
          bash scripts/check_requirements.sh --json --fix > /dev/null 2>&1
          test $? -ne 0 || { echo "--json --fix was accepted; report modes must refuse it"; exit 1; }
          set -e
          git status --porcelain --untracked-files=all > /tmp/nofix.txt
          test ! -s /tmp/nofix.txt || { echo "refused --fix still touched the tree"; cat /tmp/nofix.txt; exit 1; }

      # These are documented invariants in CLAUDE.md with copy-pasteable greps.
      # A rule with a stated verification command and no automation is a rule
      # that holds until the first person forgets to run it.
      - name: SKILL_HOMES is byte-identical everywhere
        if: always()
        run: |
          n=$(grep -rho 'SKILL_HOMES="[^"]*"' SKILL.md workflows/*.md scripts/check_requirements.sh | sort -u | wc -l)
          test "$n" -eq 1 || { echo "SKILL_HOMES diverged across $n variants"; exit 1; }

      # Scoped to the skill's own surface on purpose. `example/` is a record of a
      # render that happened, so it stays on the version it was rendered against —
      # forcing it to track a bump would edit a record to satisfy a lint.
      - name: GSAP version and SRI hash are pinned in lock-step
        if: always()
        run: |
          v=$(grep -rho 'gsap@[0-9][0-9.]*' templates/*.html workflows/*.md | sort -u | wc -l)
          h=$(grep -rho 'integrity="sha384-[^"]*"' templates/*.html workflows/*.md | sort -u | wc -l)
          test "$v" -eq 1 || { echo "$v GSAP versions in tree — a stale hash ships animation-free scenes"; exit 1; }
          test "$h" -eq 1 || { echo "$h SRI hashes in tree — same failure"; exit 1; }

  # The pointer-validity suite and the storyboard extra-keys probes skip on a
  # machine without the HyperFrames ecosystem — correct on a contributor's
  # machine, fatal as the only CI: the guards ADR-007 calls "the only thing
  # that protects the registry" never ran here, so an upstream relayout would
  # have landed green. This job installs the ecosystem from skills-lock.json's
  # sources and then REQUIRES those suites to run: HVE_REQUIRE_ECOSYSTEM=1
  # turns their skip conditions into failures (test_ecosystem_required.py), so
  # a failed or partial install fails loudly instead of skipping unnoticed.
  # The bare job above stays exactly as it is — the ecosystem remains optional
  # at test time everywhere except this job.
  ecosystem-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # node runs the vendored storyboard parser in the round-trip half of the
      # STORYBOARD_EXTRA_KEYS probe.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Tracks upstream's default branch on purpose: catching an upstream
      # relayout before a user does is this job's reason to exist. A skill
      # whose recorded skillPath vanished upstream fails the install by name.
      - name: Install the HyperFrames ecosystem from skills-lock.json
        run: python3 test/install_ecosystem.py --dest .agents/skills

      - name: Run the suite with the ecosystem required
        run: HVE_REQUIRE_ECOSYSTEM=1 bash test/run.sh
